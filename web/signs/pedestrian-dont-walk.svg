<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Pedestrian signal showing an upraised orange Don't Walk hand symbol">
  <rect x="6" y="6" width="188" height="188" rx="10" fill="#222222" stroke="#000000" stroke-width="3"/>
  <!-- Hand silhouette -->
  <g fill="#ff6f1f">
    <!-- Palm -->
    <rect x="78" y="70" width="44" height="80" rx="10"/>
    <!-- Thumb -->
    <rect x="64" y="100" width="14" height="42" rx="6"/>
    <!-- Wrist/forearm -->
    <rect x="80" y="148" width="40" height="32" rx="4"/>
  </g>
</svg>
