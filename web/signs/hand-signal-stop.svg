<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Driver's left arm bent downward at the elbow, hand pointing down, signaling stop or slow">
  <rect x="0" y="20" width="120" height="160" fill="#5b6b80" stroke="#000000" stroke-width="3"/>
  <rect x="14" y="38" width="80" height="46" fill="#a3c1e0" stroke="#000000" stroke-width="2"/>
  <!-- Upper arm extending out -->
  <g fill="#e8c19a" stroke="#000000" stroke-width="2">
    <rect x="120" y="80" width="50" height="20" rx="6"/>
    <!-- Forearm bent downward -->
    <rect x="160" y="98" width="20" height="86" rx="6"/>
    <ellipse cx="170" cy="194" rx="12" ry="14"/>
  </g>
  <text x="120" y="206" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-size="20" font-weight="900" fill="#000000">STOP / SLOW</text>
</svg>
