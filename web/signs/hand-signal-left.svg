<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="Driver's left arm extended straight out the window, signaling a left turn">
  <!-- Car door silhouette -->
  <rect x="0" y="80" width="120" height="120" fill="#5b6b80" stroke="#000000" stroke-width="3"/>
  <rect x="14" y="98" width="80" height="46" fill="#a3c1e0" stroke="#000000" stroke-width="2"/>
  <!-- Arm extended left -->
  <g fill="#e8c19a" stroke="#000000" stroke-width="2">
    <rect x="120" y="120" width="100" height="20" rx="6"/>
    <ellipse cx="220" cy="130" rx="14" ry="12"/>
  </g>
  <text x="120" y="36" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#000000">LEFT TURN</text>
</svg>
