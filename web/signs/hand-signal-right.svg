<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Driver's left arm bent upward at the elbow, hand pointing up, signaling a right turn">
  <rect x="0" y="100" width="120" height="120" fill="#5b6b80" stroke="#000000" stroke-width="3"/>
  <rect x="14" y="118" width="80" height="46" fill="#a3c1e0" stroke="#000000" stroke-width="2"/>
  <!-- Upper arm extending out -->
  <g fill="#e8c19a" stroke="#000000" stroke-width="2">
    <rect x="120" y="140" width="50" height="20" rx="6"/>
    <!-- Forearm bent upward -->
    <rect x="160" y="60" width="20" height="86" rx="6"/>
    <ellipse cx="170" cy="50" rx="12" ry="14"/>
  </g>
  <text x="120" y="36" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#000000">RIGHT TURN</text>
</svg>
