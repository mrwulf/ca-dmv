<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Round yellow railroad crossing advance warning sign with a black X and the letters R R">
  <circle cx="100" cy="100" r="92" fill="#fcc233" stroke="#000000" stroke-width="5"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- X -->
  <line x1="38" y1="38" x2="162" y2="162" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
  <line x1="162" y1="38" x2="38" y2="162" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
  <!-- R R -->
  <text x="76" y="86" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#000000">R</text>
  <text x="124" y="128" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#000000">R</text>
</svg>
