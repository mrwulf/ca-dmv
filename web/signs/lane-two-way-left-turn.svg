<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" role="img" aria-label="Roadway showing a center two-way left-turn lane bordered by yellow lines (broken inside, solid outside)">
  <rect x="0" y="20" width="280" height="160" fill="#3a3a3a"/>
  <rect x="6" y="36" width="268" height="3" fill="#ffffff"/>
  <rect x="6" y="161" width="268" height="3" fill="#ffffff"/>
  <!-- Outer solid yellow (above) and broken inside (below) -->
  <rect x="6" y="80" width="268" height="3" fill="#ffd400"/>
  <g fill="#ffd400">
    <rect x="10" y="92" width="22" height="3"/>
    <rect x="44" y="92" width="22" height="3"/>
    <rect x="78" y="92" width="22" height="3"/>
    <rect x="112" y="92" width="22" height="3"/>
    <rect x="146" y="92" width="22" height="3"/>
    <rect x="180" y="92" width="22" height="3"/>
    <rect x="214" y="92" width="22" height="3"/>
    <rect x="248" y="92" width="22" height="3"/>
  </g>
  <!-- Inner broken yellow (above) -->
  <g fill="#ffd400">
    <rect x="10" y="108" width="22" height="3"/>
    <rect x="44" y="108" width="22" height="3"/>
    <rect x="78" y="108" width="22" height="3"/>
    <rect x="112" y="108" width="22" height="3"/>
    <rect x="146" y="108" width="22" height="3"/>
    <rect x="180" y="108" width="22" height="3"/>
    <rect x="214" y="108" width="22" height="3"/>
    <rect x="248" y="108" width="22" height="3"/>
  </g>
  <rect x="6" y="120" width="268" height="3" fill="#ffd400"/>
  <!-- Left-turn arrows in the middle lane -->
  <g fill="#ffffff">
    <path d="M 90 100 L 80 100 L 80 95 L 60 100 L 80 105 L 80 100" stroke="#ffffff" stroke-width="2"/>
    <path d="M 190 100 L 200 100 L 200 95 L 220 100 L 200 105 L 200 100" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
