<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" role="img" aria-label="Roadway with a center two-way left-turn lane, bordered on each side by a solid yellow line on the traffic side and a broken yellow line on the turn-lane side, with left-turn arrows pointing both ways">
  <!-- Asphalt and solid white edge lines -->
  <rect x="0" y="20" width="280" height="160" fill="#3a3a3a"/>
  <rect x="0" y="36" width="280" height="3" fill="#ffffff"/>
  <rect x="0" y="161" width="280" height="3" fill="#ffffff"/>
  <!-- Upper edge of the center lane: solid yellow on the traffic side, broken yellow on the turn-lane side -->
  <rect x="0" y="74" width="280" height="3" fill="#ffd400"/>
  <line x1="0" y1="82.5" x2="280" y2="82.5" stroke="#ffd400" stroke-width="3" stroke-dasharray="20 14"/>
  <!-- Lower edge: broken yellow on the turn-lane side, solid yellow on the traffic side -->
  <line x1="0" y1="117.5" x2="280" y2="117.5" stroke="#ffd400" stroke-width="3" stroke-dasharray="20 14"/>
  <rect x="0" y="123" width="280" height="3" fill="#ffd400"/>
  <!-- Painted left-turn arrows, one pointing each way -->
  <g fill="#ffffff">
    <polygon points="62,100 84,87 84,95 116,95 116,105 84,105 84,113"/>
    <polygon points="218,100 196,87 196,95 164,95 164,105 196,105 196,113"/>
  </g>
</svg>
