<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="Roadway with a solid white fog line marking the right edge of the travel lane">
  <rect x="0" y="20" width="240" height="160" fill="#3a3a3a"/>
  <!-- Broken white between same-direction lanes (typical) -->
  <g fill="#ffffff">
    <rect x="10" y="98" width="22" height="3"/>
    <rect x="44" y="98" width="22" height="3"/>
    <rect x="78" y="98" width="22" height="3"/>
    <rect x="112" y="98" width="22" height="3"/>
    <rect x="146" y="98" width="22" height="3"/>
    <rect x="180" y="98" width="22" height="3"/>
    <rect x="214" y="98" width="22" height="3"/>
  </g>
  <!-- Fog line: solid white at the right edge -->
  <rect x="6" y="36" width="228" height="4" fill="#ffffff"/>
  <rect x="6" y="160" width="228" height="6" fill="#ffffff"/>
</svg>
